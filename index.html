<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecniPana</title>
    <style>
        :root {
            /* Paleta oficial TecniPana */
            --tp-blue: #002d5a;
            --tp-yellow: #ffcc00;
            --tp-black: #050505;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Arial Black', sans-serif;
            background-color: var(--tp-black);
            color: white;
            overflow-x: hidden;
        }

        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #111 0%, #000 100%);
            position: relative;
        }

        /* TÍTULO PRINCIPAL: SOLO TECNIPANA */
        .brand-name {
            font-size: clamp(3.5rem, 12vw, 8rem);
            color: var(--tp-yellow);
            text-transform: uppercase;
            margin-bottom: 40px;
            letter-spacing: -2px;
            z-index: 10;
        }

        /* CONTENEDOR 3D */
        .scene {
            width: 500px;
            height: 300px;
            perspective: 1200px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* ÓRBITA DE MARCAS */
        .orbit {
            position: absolute;
            width: 100%; height: 100%;
            transform-style: preserve-3d;
            animation: orbitRotation 20s linear infinite;
        }

        @keyframes orbitRotation {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        .brand-tag {
            position: absolute;
            color: var(--tp-yellow);
            font-weight: bold;
            font-size: 1rem;
            transform: translateZ(320px);
        }

        /* UNIDAD DE AIRE - CORRECCIÓN DE TAPAS */
        .ac-unit {
            width: 400px;
            height: 120px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-10deg) rotateY(-20deg);
        }

        .face {
            position: absolute;
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
            border: 1px solid #ccc;
        }

        /* Caras principales */
        .front { 
            width: 400px; height: 120px; 
            transform: translateZ(40px); 
            border-radius: 5px 5px 35px 35px; /* Forma curva */
        }
        .back  { 
            width: 400px; height: 120px; 
            transform: rotateY(180deg) translateZ(40px); 
        }
        .top   { 
            width: 400px; height: 80px; 
            transform: rotateX(90deg) translateZ(40px); 
        }
        .bottom{ 
            width: 400px; height: 80px; 
            transform: rotateX(-90deg) translateZ(80px); 
            background: #bbb;
        }

        /* Tapas laterales: Sellado total a los bordes */
        .left { 
            width: 80px; height: 120px; 
            transform: rotateY(-90deg) translateZ(200px); 
            border-radius: 5px 5px 5px 35px;
        }
        .right { 
            width: 80px; height: 120px; 
            transform: rotateY(90deg) translateZ(200px); 
            border-radius: 5px 5px 35px 5px;
        }

        .footer-tag {
            margin-top: 50px;
            color: var(--tp-yellow);
            letter-spacing: 6px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .whatsapp-btn {
            background: var(--tp-yellow);
            color: var(--tp-blue);
            padding: 18px 45px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 900;
            font-size: 1.4rem;
            margin-top: 35px;
            transition: 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
        .whatsapp-btn:hover { background: white; transform: translateY(-5px); }

    </style>
</head>
<body>

    <header>
        <h1 class="brand-name">TECNIPANA</h1>

        <div class="scene">
            <div class="orbit">
                <span class="brand-tag" style="transform: rotateY(0deg) translateZ(300px)">SAMSUNG</span>
                <span class="brand-tag" style="transform: rotateY(72deg) translateZ(300px)">LG</span>
                <span class="brand-tag" style="transform: rotateY(144deg) translateZ(300px)">HAIER</span>
                <span class="brand-tag" style="transform: rotateY(216deg) translateZ(300px)">CARRIER</span>
                <span class="brand-tag" style="transform: rotateY(288deg) translateZ(300px)">PANASONIC</span>
            </div>

            <div class="ac-unit">
                <div class="face front"></div>
                <div class="face back"></div>
                <div class="face top"></div>
                <div class="face bottom"></div>
                <div class="face left"></div>
                <div class="face right"></div>
            </div>
        </div>

        <p class="footer-tag">A TODA VENEZUELA</p>
        <a href="https://wa.me/584122781155" class="whatsapp-btn">ESCRIBIR AL PANA</a>
    </header>

</body>
</html>
